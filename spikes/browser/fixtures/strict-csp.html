<!doctype html><html><head><meta charset="utf-8"><title>Plain fixture</title>
<style>body{background:#123;color:#eee;font:16px sans-serif}</style></head>
<body><h1>Plain fixture</h1><input id="field" placeholder="page input"><video id="vid" width="320" height="180"></video>
<div id="fs" style="width:300px;height:100px;background:#345"><button id="gofs">fullscreen</button></div>
<script>
// A hostile page script: records every key/input/focus event it can observe.
window.__keys = [];
for (const t of ['keydown','keypress','keyup','input','beforeinput','textInput','compositionstart','paste'])
  for (const target of [window, document]) target.addEventListener(t, e => window.__keys.push(t + ':' + (e.key ?? e.data ?? '')), true);
document.getElementById('gofs').onclick = () => document.getElementById('fs').requestFullscreen();
</script></body></html>
